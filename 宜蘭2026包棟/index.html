<script>
const stays = JSON.parse(document.querySelector('#stay-data').textContent);
const towns = JSON.parse(document.querySelector('#map-data').textContent);
const list = document.querySelector('#list');
const summary = document.querySelector('#summary');
const detail = document.querySelector('#details');
const sort = document.querySelector('#sort');
const priceFormat = new Intl.NumberFormat('zh-TW');
const svgNS = 'http://www.w3.org/2000/svg';
let selected = stays.find(stay => '#' + stay.id === location.hash) ?? stays[0];

function node(tag, className, content) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (content !== undefined) element.textContent = content;
  return element;
}
function svg(tag, attrs, content) {
  const element = document.createElementNS(svgNS, tag);
  Object.entries(attrs).forEach(([name, value]) => element.setAttribute(name, value));
  if (content !== undefined) element.textContent = content;
  return element;
}
function displayPrice(stay) {
  return stay.price === null || stay.price === undefined ? '價格待補' : 'NT$ ' + priceFormat.format(stay.price);
}
function selectStay(stay) {
  selected = stay;
  history.replaceState(null, '', '#' + stay.id);
  renderSummary();
  syncSelection();
  if (matchMedia('(max-width: 625px)').matches) {
    document.querySelector('#selection').scrollIntoView({block:'start'});
    document.querySelector('#stay-title').focus({preventScroll:true});
  }
}
function syncSelection() {
  document.querySelectorAll('[data-stay]').forEach(element => {
    element.setAttribute('aria-pressed', String(element.dataset.stay === selected.id));
  });
}
function renderList() {
  const ordered = [...stays];
  if (sort.value === 'price') ordered.sort((a,b) => (a.price ?? Infinity) - (b.price ?? Infinity));
  list.replaceChildren();
  for (const stay of ordered) {
    const button = node('button','stay');
    button.type = 'button';
    button.dataset.stay = stay.id;
    const text = node('span');
    text.append(node('strong','',stay.name),node('small','',stay.area),node('span','list-price',displayPrice(stay) + (stay.priceLabel ? ' · ' + stay.priceLabel : '')));
    button.append(node('span','number',stay.id),text);
    button.addEventListener('click', () => selectStay(stay));
    list.append(button);
  }
  syncSelection();
}
function externalLink(title, url) {
  const link = node('a','',title);
  link.href = url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  return link;
}
function renderSummary() {
  const stay = selected;
  const heading = node('h2','',stay.name);
  heading.id = 'stay-title';
  heading.tabIndex = -1;
  const price = node('p','price',displayPrice(stay));
  if (stay.priceLabel) price.append(node('small','',stay.priceLabel));
  const links = node('div','links');
  if (stay.url) links.append(externalLink('住宿網址 ↗',stay.url));
  if (stay.address) links.append(externalLink('導航 ↗','https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(stay.address)));
  if (stay.source) links.append(externalLink('地址來源 ↗',stay.source));
  summary.replaceChildren(node('p','eyebrow',stay.id + ' · ' + stay.area),heading,price,node('p','address',stay.address ?? '地址待補'));
  if (links.childElementCount) summary.append(links);
  if (stay.tags?.length) {
    const tags = node('div','tags');
    stay.tags.forEach(tag => tags.append(node('span','',tag)));
    summary.append(tags);
  }
  if (stay.note) summary.append(node('p','note',stay.note));
  if (stay.photos?.length) summary.append(createGallery(stay.photos));

  const detailTitle = node('h2','','詳細資料');
  detailTitle.id = 'detail-title';
  detail.replaceChildren(detailTitle);
  for (const [index,[title,items]] of Object.entries(stay.details ?? {}).entries()) {
    const group = node('details');
    group.open = index === 0 || title === '烤肉與火鍋';
    const bullets = node('ul');
    items.forEach(item => bullets.append(node('li','',item)));
    group.append(node('summary','',title),bullets);
    detail.append(group);
  }
  detail.hidden = detail.childElementCount === 1;
}
function createGallery(photos) {
  const gallery = node('figure','gallery');
  const photo = node('div','photo');
  const image = node('img');
  const fallback = node('span','','照片暫時無法載入，請開啟住宿網址。');
  fallback.hidden = true;
  const caption = node('figcaption');
  const previous = node('button','','‹');
  const next = node('button','','›');
  const position = node('span');
  position.setAttribute('aria-live','polite');
  previous.type = next.type = 'button';
  previous.setAttribute('aria-label','上一張照片');
  next.setAttribute('aria-label','下一張照片');
  previous.disabled = next.disabled = photos.length < 2;
  let index = 0;
  const show = () => {
    const [url,alt] = photos[index];
    fallback.hidden = true;
    image.hidden = false;
    image.alt = alt;
    image.src = url;
    position.textContent = (index + 1) + ' / ' + photos.length + ' · 官網照片';
  };
  image.referrerPolicy = 'no-referrer';
  image.addEventListener('error', () => {image.hidden = true; fallback.hidden = false;});
  previous.addEventListener('click', () => {index = (index - 1 + photos.length) % photos.length; show();});
  next.addEventListener('click', () => {index = (index + 1) % photos.length; show();});
  photo.append(image,fallback);
  caption.append(previous,position,next);
  gallery.append(photo,caption);
  show();
  return gallery;
}
function renderMap() {
  const townLayer = document.querySelector('#towns');
  const labelLayer = document.querySelector('#labels');
  const pinLayer = document.querySelector('#pins');
  const labels = {'頭城鎮':[421,95],'礁溪鄉':[330,153],'宜蘭市':[351,210],'壯圍鄉':[384,211],'員山鄉':[297,215],'五結鄉':[394,246],'羅東鎮':[361,258],'冬山鄉':[355,286],'三星鄉':[301,257],'蘇澳鎮':[392,334],'大同鄉':[208,347],'南澳鄉':[304,410]};
  for (const [name,path] of towns) {
    townLayer.append(svg('path',{d:path,class:'land','fill-rule':'evenodd'}));
    if (labels[name]) {
      const [x,y] = labels[name];
      labelLayer.append(svg('text',{x,y,class:'town-label'},name));
    }
  }
  const points = stays.filter(stay => stay.point && !stay.outside);
  document.querySelector('#map-count').textContent = points.length + ' 個地點';
  const used = [];
  for (const stay of points) {
    const [lon,lat] = stay.point;
    const x = (lon - 121.22) * 605 + 30;
    const y = (25.025 - lat) * 665 + 30;
    let px = x;
    let py = y;
    while (used.some(([otherX,otherY]) => Math.hypot(otherX - px,otherY - py) < 30)) {
      px += 26;
      py -= 9;
    }
    used.push([px,py]);
    if (px !== x || py !== y) {
      pinLayer.append(svg('path',{d:'M'+x+','+y+'L'+px+','+py,stroke:'#91523b','stroke-width':1.5}));
      pinLayer.append(svg('circle',{cx:x,cy:y,r:2.7,fill:'#91523b'}));
    }
    const pin = svg('g',{class:'pin',transform:'translate('+px+','+py+')',tabindex:0,role:'button','aria-label':stay.name + '，' + displayPrice(stay)});
    pin.dataset.stay = stay.id;
    pin.append(svg('title',{},stay.name + ' · ' + displayPrice(stay)),svg('circle',{r:14}),svg('text',{x:0,y:0},stay.id));
    pin.addEventListener('click', () => selectStay(stay));
    pin.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        selectStay(stay);
      }
    });
    pinLayer.append(pin);
  }
}
document.querySelector('#count').textContent = '（' + stays.length + '）';
sort.addEventListener('change',renderList);
renderMap();
renderList();
renderSummary();
</script>
</body>
</html>
